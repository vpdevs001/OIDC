<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Registration</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background-color: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
      }
      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
      }
      form {
        display: flex;
        flex-direction: column;
      }
      label {
        margin-bottom: 5px;
        color: #555;
        font-weight: bold;
      }
      input {
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
      }
      input:focus {
        border-color: #007bff;
        outline: none;
      }
      button {
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #0056b3;
      }
      .result {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        font-size: 14px;
        white-space: pre-wrap;
      }
      .success {
        background-color: #e6fffa;
        border: 1px solid #38b2ac;
        color: #065f46;
      }
      .error {
        background-color: #ffe6e6;
        border: 1px solid #ef4444;
        color: #7f1d1d;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Register Your Application</h1>

      <form id="appForm">
        <label for="displayName">Application Display Name:</label>
        <input type="text" id="displayName" required />

        <label for="appUrl">Application URL:</label>
        <input type="url" id="appUrl" required />

        <label for="redirectUri">Redirection URI:</label>
        <input type="url" id="redirectUri" required />

        <button type="submit">Register Application</button>
      </form>

      <div id="result" class="result" style="display: none"></div>
    </div>

    <script>
      const form = document.getElementById("appForm");
      const resultDiv = document.getElementById("result");

      function showResult(message, type) {
        resultDiv.style.display = "block";
        resultDiv.className = `result ${type}`;
        resultDiv.textContent = message;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const displayName = document.getElementById("displayName").value.trim();
        const appUrl = document.getElementById("appUrl").value.trim();
        const redirectUri = document.getElementById("redirectUri").value.trim();

        if (!displayName || !appUrl || !redirectUri) {
          showResult("All fields are required.", "error");
          return;
        }

        try {
          const res = await fetch("/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              displayName,
              appUrl,
              redirectUri,
            }),
          });

          const contentType = res.headers.get("content-type") || "";

          let data = {};

          if (contentType.includes("application/json")) {
            data = await res.json();
          } else {
            const text = await res.text();
            console.error("Non-JSON response:", text);
          }

          if (!res.ok) {
            showResult(data.message || "Something went wrong.", "error");
          } else {
            showResult(
              `Client ID:\n${data.clientId}\n\nClient Secret:\n${data.clientSecret}`,
              "success",
            );
          }
        } catch {
          showResult("Network error. Please try again.", "error");
        }
      });
    </script>
  </body>
</html>
