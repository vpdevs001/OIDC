<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — OIDC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0b0a12;
        --surface: #14121f;
        --card: rgba(22, 19, 38, 0.65);
        --border: rgba(244, 114, 182, 0.18);
        --accent: #f472b6;
        --accent2: #e879f9;
        --glow: rgba(244, 114, 182, 0.3);
        --text: #e8e2f0;
        --muted: #9289a8;
        --danger: #f87171;
        --danger-bg: rgba(248, 113, 113, 0.08);
        --success-bg: rgba(244, 114, 182, 0.08);
        --radius: 1rem;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }
      .bg-glow {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .bg-glow::before,
      .bg-glow::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(110px);
        opacity: 0.4;
        animation: drift 14s ease-in-out infinite alternate;
      }
      .bg-glow::before {
        width: 450px;
        height: 450px;
        background: radial-gradient(
          circle,
          rgba(244, 114, 182, 0.5),
          transparent 70%
        );
        top: -12%;
        left: -6%;
      }
      .bg-glow::after {
        width: 380px;
        height: 380px;
        background: radial-gradient(
          circle,
          rgba(232, 121, 249, 0.4),
          transparent 70%
        );
        bottom: -10%;
        right: -4%;
        animation-delay: 5s;
      }
      @keyframes drift {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(-25px, 18px) scale(1.06);
        }
      }
      .auth-card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
        backdrop-filter: blur(24px) saturate(1.4);
        box-shadow:
          0 0 60px -15px var(--glow),
          0 24px 48px -12px rgba(0, 0, 0, 0.45);
        animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .auth-card h1 {
        font-size: 1.65rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #fff;
        margin-bottom: 0.35rem;
      }
      .auth-card .subtitle {
        font-size: 0.875rem;
        color: var(--muted);
        margin-bottom: 1.8rem;
      }
      #client-meta {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.85rem 1rem;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 1.5rem;
        word-break: break-all;
        line-height: 1.6;
      }
      #client-meta .label {
        font-weight: 600;
        color: var(--text);
      }
      .form-group {
        margin-bottom: 1.1rem;
      }
      .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 0.4rem;
      }
      .form-group input {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.75rem 1rem;
        color: #fff;
        font-size: 0.9rem;
        outline: none;
        transition:
          border 0.2s,
          box-shadow 0.2s;
      }
      .form-group input::placeholder {
        color: var(--muted);
        opacity: 0.6;
      }
      .form-group input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.18);
      }
      .btn-primary {
        width: 100%;
        padding: 0.8rem;
        border: none;
        border-radius: var(--radius);
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #0b0a12;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.25s;
        margin-top: 0.4rem;
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 24px -4px var(--glow);
      }
      .btn-primary:active {
        transform: translateY(0);
      }
      .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      #status {
        display: none;
        margin-top: 1rem;
        border-radius: var(--radius);
        padding: 0.7rem 1rem;
        font-size: 0.8rem;
        border: 1px solid transparent;
      }
      #status.visible {
        display: block;
      }
      #status.error {
        border-color: rgba(248, 113, 113, 0.25);
        background: var(--danger-bg);
        color: #fca5a5;
      }
      #status.info {
        border-color: rgba(244, 114, 182, 0.2);
        background: var(--success-bg);
        color: #f9a8d4;
      }
      .bottom-link {
        margin-top: 1.4rem;
        font-size: 0.82rem;
        color: var(--muted);
        text-align: center;
      }
      .bottom-link a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }
      .bottom-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="bg-glow"></div>
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="subtitle">Sign up to authorize with the application.</p>
      <div id="client-meta"></div>
      <form id="signup-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            placeholder="Jane Doe"
          />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            placeholder="you@example.com"
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            placeholder="••••••••"
          />
        </div>
        <button id="submit-button" type="submit" class="btn-primary">
          Create Account
        </button>
      </form>
      <div id="status"></div>
      <p class="bottom-link">
        Already have an account?
        <a id="signin-link" href="/api/auth/signin">Sign in</a>
      </p>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const clientId = params.get("client_id");
      const redirectUri = params.get("redirect_uri");
      const state = params.get("state");
      const form = document.getElementById("signup-form");
      const statusBox = document.getElementById("status");
      const submitButton = document.getElementById("submit-button");
      const clientMeta = document.getElementById("client-meta");
      const signinLink = document.getElementById("signin-link");

      const setStatus = (message, type) => {
        statusBox.textContent = message;
        statusBox.className =
          type === "error" ? "visible error" : "visible info";
      };

      if (clientId) {
        clientMeta.innerHTML = `<p><span class="label">Client:</span> ${clientId}</p><p><span class="label">Redirect:</span> ${redirectUri || "Default registered URL"}</p>`;
        signinLink.href = `/api/auth/signin${window.location.search}`;
      } else {
        clientMeta.innerHTML = `<p style="color:#f87171;font-weight:600">No client_id provided.</p><p>Open this page via a registered client link.</p>`;
        submitButton.disabled = true;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setStatus("Creating account…", "info");
        const payload = {
          name: form.name.value,
          email: form.email.value,
          password: form.password.value,
          clientId,
          redirectUri: redirectUri || undefined,
          state: state || undefined,
        };
        try {
          const response = await fetch(window.location.pathname, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const result = await response.json();
          if (!response.ok || !result.success)
            throw new Error(result.message || "Sign up failed");
          setStatus("Authorized — redirecting…", "info");
          setTimeout(() => {
            window.location.href = result.data.redirectTo;
          }, 700);
        } catch (error) {
          setStatus(error.message || "Sign up failed", "error");
        }
      });
    </script>
  </body>
</html>
