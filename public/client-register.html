<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Client — OIDC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0a0c14;
        --surface: #12151f;
        --card: rgba(18, 21, 34, 0.7);
        --border: rgba(56, 189, 248, 0.15);
        --accent: #38bdf8;
        --accent2: #22d3ee;
        --glow: rgba(56, 189, 248, 0.28);
        --text: #dfe6f0;
        --muted: #7e8ba4;
        --danger: #f87171;
        --danger-bg: rgba(248, 113, 113, 0.08);
        --success-bg: rgba(56, 189, 248, 0.06);
        --radius: 1rem;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
        padding: 1.5rem;
      }
      .bg-glow {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .bg-glow::before,
      .bg-glow::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.35;
        animation: drift 16s ease-in-out infinite alternate;
      }
      .bg-glow::before {
        width: 500px;
        height: 500px;
        background: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.5),
          transparent 70%
        );
        top: -10%;
        right: -8%;
      }
      .bg-glow::after {
        width: 420px;
        height: 420px;
        background: radial-gradient(
          circle,
          rgba(34, 211, 238, 0.4),
          transparent 70%
        );
        bottom: -12%;
        left: -6%;
        animation-delay: 6s;
      }
      @keyframes drift {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(20px, -15px) scale(1.07);
        }
      }

      .page {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 920px;
        display: grid;
        gap: 2rem;
      }
      @media (min-width: 768px) {
        .page {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* left hero */
      .hero {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .hero h1 {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #fff;
        line-height: 1.2;
      }
      .hero .subtitle {
        font-size: 0.95rem;
        color: var(--muted);
        margin-top: 0.6rem;
        line-height: 1.6;
      }

      /* right form card */
      .form-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        padding: 2.2rem 1.8rem;
        backdrop-filter: blur(24px) saturate(1.3);
        box-shadow:
          0 0 60px -15px var(--glow),
          0 24px 48px -12px rgba(0, 0, 0, 0.5);
        animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .form-card h2 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 1.4rem;
      }

      .form-group {
        margin-bottom: 1.1rem;
      }
      .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 0.4rem;
      }
      .form-group input {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.75rem 1rem;
        color: #fff;
        font-size: 0.9rem;
        outline: none;
        transition:
          border 0.2s,
          box-shadow 0.2s;
      }
      .form-group input::placeholder {
        color: var(--muted);
        opacity: 0.55;
      }
      .form-group input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      }

      .btn-primary {
        width: 100%;
        padding: 0.8rem;
        border: none;
        border-radius: var(--radius);
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #0a0c14;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.25s;
        margin-top: 0.3rem;
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 24px -4px var(--glow);
      }
      .btn-primary:active {
        transform: translateY(0);
      }

      #status {
        display: none;
        margin-top: 1rem;
        border-radius: var(--radius);
        padding: 0.7rem 1rem;
        font-size: 0.8rem;
        border: 1px solid transparent;
      }
      #status.visible {
        display: block;
      }
      #status.error {
        border-color: rgba(248, 113, 113, 0.25);
        background: var(--danger-bg);
        color: #fca5a5;
      }
      #status.info {
        border-color: rgba(56, 189, 248, 0.2);
        background: var(--success-bg);
        color: #7dd3fc;
      }

      #result {
        display: none;
        margin-top: 1.2rem;
        border-radius: var(--radius);
        border: 1px solid rgba(56, 189, 248, 0.2);
        background: rgba(56, 189, 248, 0.05);
        padding: 1rem 1.1rem;
        font-size: 0.8rem;
        color: var(--text);
        line-height: 1.7;
        word-break: break-all;
      }
      #result.visible {
        display: block;
      }
      #result .rlabel {
        font-weight: 600;
        color: #7dd3fc;
      }
      #result a {
        color: var(--accent);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="bg-glow"></div>
    <div class="page">
      <div class="hero">
        <h1>Register an OAuth Client</h1>
        <p class="subtitle">
          Generate a client ID and secret to integrate the authorization code
          flow into your app.
        </p>
      </div>

      <div class="form-card">
        <h2>New Client</h2>
        <form id="client-form">
          <div class="form-group">
            <label for="applicationName">App Name</label>
            <input
              id="applicationName"
              name="applicationName"
              type="text"
              required
              placeholder="My App"
            />
          </div>
          <div class="form-group">
            <label for="contactEmail">Contact Email</label>
            <input
              id="contactEmail"
              name="contactEmail"
              type="email"
              required
              placeholder="dev@example.com"
            />
          </div>
          <div class="form-group">
            <label for="applicationUrl">App URL</label>
            <input
              id="applicationUrl"
              name="applicationUrl"
              type="url"
              required
              placeholder="https://myapp.dev"
            />
          </div>
          <div class="form-group">
            <label for="redirectUrl">Redirect URL</label>
            <input
              id="redirectUrl"
              name="redirectUrl"
              type="url"
              required
              placeholder="https://myapp.dev/callback"
            />
          </div>
          <button type="submit" class="btn-primary">Create Client</button>
        </form>
        <div id="status"></div>
        <div id="result"></div>
      </div>
    </div>

    <script>
      const form = document.getElementById("client-form");
      const statusBox = document.getElementById("status");
      const resultBox = document.getElementById("result");

      const setStatus = (msg, type) => {
        statusBox.textContent = msg;
        statusBox.className =
          type === "error" ? "visible error" : "visible info";
      };

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        resultBox.className = "";
        setStatus("Creating client…", "info");

        const payload = {
          applicationName: form.applicationName.value,
          contactEmail: form.contactEmail.value,
          applicationUrl: form.applicationUrl.value,
          redirectUrl: form.redirectUrl.value,
        };

        try {
          const res = await fetch(window.location.pathname, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok || !data.success)
            throw new Error(data.message || "Registration failed");

          const c = data.data;
          const base = window.location.origin;
          const signin = `${base}/api/auth/signin?client_id=${encodeURIComponent(c.clientId)}&redirect_uri=${encodeURIComponent(c.redirectUrl)}`;
          const signup = `${base}/api/auth/signup?client_id=${encodeURIComponent(c.clientId)}&redirect_uri=${encodeURIComponent(c.redirectUrl)}`;

          setStatus("Client created.", "info");
          resultBox.innerHTML = `
          <p style="font-weight:700;color:#fff;margin-bottom:.6rem">Credentials</p>
          <p><span class="rlabel">Client ID:</span> ${c.clientId}</p>
          <p><span class="rlabel">Client Secret:</span> ${c.clientSecret}</p>
          <p><span class="rlabel">Signin:</span> <a href="${signin}">${signin}</a></p>
          <p><span class="rlabel">Signup:</span> <a href="${signup}">${signup}</a></p>`;
          resultBox.className = "visible";
        } catch (err) {
          setStatus(err.message || "Registration failed", "error");
        }
      });
    </script>
  </body>
</html>
